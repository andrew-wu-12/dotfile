# Install plugins under XDG so everything lives in ~/.config/tmux/plugins
set-environment -g TMUX_PLUGIN_MANAGER_PATH "~/.config/tmux/plugins/"

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'omerxx/tmux-sessionx'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'catppuccin/tmux'
set -g @plugin 'tmux-plugins/tmux-resurrect'
# continuum must be the last @plugin entry
set -g @plugin 'tmux-plugins/tmux-continuum'

set -g prefix ^B
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g status-position top
setw -g mode-keys vi

# Options to make tmux more pleasant
set -g mouse on
set -g default-terminal "screen-256color"

# Configure the catppuccin plugin
set -g @catppuccin_flavor "mocha"
set -g @catppuccin_window_status_style "rounded"
# Render the window NAME, not the pane title, in the window list. tmux-dev-layout.sh
# names windows "{branch}({repo})" and tmux-agent-notify.sh prefixes them with 🔴/🟢;
# catppuccin defaults to #T, which Claude Code and nvim overwrite. Must be set before
# catppuccin.tmux runs. NOTE: the window list itself is blanked further below for a
# minimal bar, so these are currently inert — kept so unhiding the list "just works".
set -g @catppuccin_window_text " #W"
set -g @catppuccin_window_current_text " #W"

set -g @vim_navigator_mapping_left "C-Left C-h"  # use C-h and C-Left
set -g @vim_navigator_mapping_right "C-Right C-l"
set -g @vim_navigator_mapping_up "C-k"
set -g @vim_navigator_mapping_down "C-j"
set -g @vim_navigator_mapping_prev ""  # removes the C-\ binding
set -g @vim_navigator_prefix_mapping_clear_screen ""
# Load catppuccin (only if TPM has installed it; the repo 'catppuccin/tmux'
# lands in a dir named 'tmux'). Guarded so a fresh machine doesn't error.
if-shell "test -e ~/.config/tmux/plugins/tmux/catppuccin.tmux" \
  "run ~/.config/tmux/plugins/tmux/catppuccin.tmux"

# Session persistence: resurrect saves/restores, continuum automates both.
# Restore happens on server start, so sessions come back after a reboot.
set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-strategy-nvim 'session'
set -g @continuum-restore 'on'
set -g @continuum-save-interval '5'
# resurrect doesn't capture custom window user options (e.g. @ticket_title,
# set by tmux-dev-layout.sh for mwt ticket windows), so re-apply it from each
# worktree's sibling .title file once restore finishes. See
# tmux-restore-ticket-titles.sh.
set -g @resurrect-hook-post-restore-all '~/bin/tmux-restore-ticket-titles.sh'
# continuum's restore has no notion of "reboot" vs "I manually killed every
# window" — it blindly replays the last periodic autosave (every 5 min) on any
# fresh server start. Killing the last window kills the server instantly, so
# no autosave ever captures the resulting empty state; the next start just
# replays stale pre-kill windows. tmux_no_auto_restore is continuum's own
# escape hatch (checked in continuum_restore.sh) — set it on session-closed
# (fires when a session is destroyed, i.e. exactly this case) and self-clear
# it ~15s later, safely past continuum's 10s restore-decision window, so a
# genuine reboot still restores normally.
set-hook -g session-closed 'run-shell "touch ~/tmux_no_auto_restore"'
run-shell "(sleep 15 && rm -f ~/tmux_no_auto_restore) >/dev/null 2>&1 &"

bind C-o popup -E -d "#{pane_current_path}" -w 90% -h 90% "opencode"
bind C-g popup -E -d "#{pane_current_path}" -w 90% -h 90% "lazygit"
bind C-e popup -E -d "#{pane_current_path}" -w 90% -h 90% "nvim"
# Vertical window "tabs": fzf popup over all windows in all sessions, colored
# preview, Enter switches. Replaces native choose-tree. See tmux-window-picker.sh.
bind w display-popup -E -w 50% -h 70% "~/bin/tmux-window-picker.sh"
# Status + switcher for the single MOP `yarn serve` window (port is hardcoded,
# so only one can run at a time). See tmux-serve-popup.sh. Overrides the
# default next-window binding (window switching already goes through prefix w).
bind n display-popup -E -w 70% -h 60% "~/bin/tmux-serve-popup.sh"
# Scratch terminal popup: a floating shell in the current pane's directory,
# for one-off commands without opening a real pane/window. Overrides the
# default previous-window binding (already redundant, same as n above).
bind p display-popup -E -d "#{pane_current_path}" -w 80% -h 80%
# Make the status line pretty and add some modules
set -g status-right-length 100
set -g status-left-length 100
set -g status-left ""
set -g status-right "#{E:@catppuccin_status_application}"
set -agF status-right "#{E:@catppuccin_status_cpu}"
set -ag status-right "#{E:@catppuccin_status_session}"
set -ag status-right "#{E:@catppuccin_status_uptime}"
set -agF status-right "#{E:@catppuccin_status_battery}"

# Auto-install TPM on a fresh machine, then install all @plugin entries.
if-shell "test ! -d ~/.config/tmux/plugins/tpm" \
  "run 'git clone https://github.com/tmux-plugins/tpm ~/.config/tmux/plugins/tpm && ~/.config/tmux/plugins/tpm/bin/install_plugins'"

run '~/.config/tmux/plugins/tpm/tpm'

# Ensure all declared @plugin entries are installed (TPM exists but some may be
# missing on an already-bootstrapped machine). For each declared owner/repo,
# check its plugin dir (the part after the last "/") exists; install if any is
# absent. No per-plugin list to maintain.
if-shell 'for p in $(grep -E "^[^#]*@plugin" ~/.tmux.conf | grep -oE "[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+"); do [ -d "$HOME/.config/tmux/plugins/${p##*/}" ] || exit 0; done; exit 1' \
  "run '~/.config/tmux/plugins/tpm/bin/install_plugins'"

# Hide the horizontal window list from the top bar for a minimal screen — window
# switching is the vertical `prefix w` picker (tmux-window-picker.sh) instead.
# MUST be the last thing in this file: catppuccin sets these formats, and so does
# `run '.../tpm/tpm'` above when it re-sources catppuccin.tmux, so anything earlier
# gets overwritten. tmux-agent-notify.sh's 🔴/🟢 live in the window NAME, so they
# still show in the picker and still fire macOS notifications — just not on the bar.
set -g window-status-format ""
set -g window-status-current-format ""
set -g window-status-separator ""
