# Install plugins under XDG so everything lives in ~/.config/tmux/plugins
set-environment -g TMUX_PLUGIN_MANAGER_PATH "~/.config/tmux/plugins/"

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'omerxx/tmux-sessionx'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'catppuccin/tmux'
set -g @plugin 'tmux-plugins/tmux-resurrect'
# continuum must be the last @plugin entry
set -g @plugin 'tmux-plugins/tmux-continuum'

set -g prefix ^B
# Default (on) detaches the client when its session is destroyed even if others exist. worktree-done.sh kills
# a ticket session's often-only window; without this, tearing down a worktree kicks you out of tmux entirely.
set -g detach-on-destroy off
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g status-position top
setw -g mode-keys vi

set -g mouse on
set -g default-terminal "screen-256color"

set -g @catppuccin_flavor "mocha"
set -g @catppuccin_window_status_style "rounded"
# Render the window NAME, not the pane title: catppuccin defaults to #T, which Claude Code and nvim overwrite,
# hiding tmux-dev-layout.sh's "{branch}({repo})" names and tmux-agent-notify.sh's 🔴/🟢 markers. Must be set
# before catppuccin.tmux runs. Currently inert (the window list is blanked below); kept so unhiding just works.
set -g @catppuccin_window_text " #W"
set -g @catppuccin_window_current_text " #W"

set -g @vim_navigator_mapping_left "C-Left C-h"  # use C-h and C-Left
set -g @vim_navigator_mapping_right "C-Right C-l"
set -g @vim_navigator_mapping_up "C-k"
set -g @vim_navigator_mapping_down "C-j"
set -g @vim_navigator_mapping_prev ""  # removes the C-\ binding
set -g @vim_navigator_prefix_mapping_clear_screen ""
# Load catppuccin only if TPM has installed it (the repo 'catppuccin/tmux' lands in a dir named 'tmux').
if-shell "test -e ~/.config/tmux/plugins/tmux/catppuccin.tmux" \
  "run ~/.config/tmux/plugins/tmux/catppuccin.tmux"

# resurrect saves/restores, continuum automates both; restore runs on server start, so sessions survive a reboot.
set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-strategy-nvim 'session'
set -g @continuum-restore 'on'
set -g @continuum-save-interval '5'
# resurrect doesn't capture custom window options (e.g. @ticket_title), so re-apply it from each worktree's
# sibling .title file once restore finishes (tmux-restore-ticket-titles.sh).
set -g @resurrect-hook-post-restore-all '~/bin/tmux-restore-ticket-titles.sh'
# continuum blindly replays the last autosave on any fresh server start, and killing the last window kills the
# server before another autosave captures the empty state, so stale windows come back. tmux_no_auto_restore is
# continuum's own escape hatch (checked in continuum_restore.sh): set it on session-closed and self-clear ~15s
# later, past continuum's 10s restore-decision window, so a genuine reboot still restores.
set-hook -g session-closed 'run-shell "touch ~/tmux_no_auto_restore"'
run-shell "(sleep 15 && rm -f ~/tmux_no_auto_restore) >/dev/null 2>&1 &"

bind C-g popup -E -d "#{pane_current_path}" -w 90% -h 90% "lazygit"
bind C-e popup -E -d "#{pane_current_path}" -w 90% -h 90% "nvim"
# Vertical window "tabs" (tmux-window-picker.sh, tmux-serve-lib.sh): fzf popup over all windows in all sessions,
# plus MOP `yarn serve` control (ports are hardcoded, so only one can run at a time). Tab toggles in JIRA
# tickets with no worktree yet; enter on one creates it via mwt -n. Replaces native choose-tree.
bind w display-popup -E -w 90% -h 80% "~/bin/tmux-window-picker.sh"
# Forgejo issue picker (homelab repo); enter opens a worktree via wt -n. See tmux-forgejo-picker.sh.
bind i display-popup -E -w 90% -h 80% "~/bin/tmux-forgejo-picker.sh"
# Scratch terminal popup in the current pane's directory; overrides the default previous-window binding
# (redundant with prefix w).
bind p display-popup -E -d "#{pane_current_path}" -w 80% -h 80%
set -g status-right-length 100
set -g status-left-length 100
set -g status-left ""
set -g status-right "#{E:@catppuccin_status_application}"
set -agF status-right "#{E:@catppuccin_status_cpu}"
set -ag status-right "#{E:@catppuccin_status_session}"
set -ag status-right "#{E:@catppuccin_status_uptime}"
set -agF status-right "#{E:@catppuccin_status_battery}"

if-shell "test ! -d ~/.config/tmux/plugins/tpm" \
  "run 'git clone https://github.com/tmux-plugins/tpm ~/.config/tmux/plugins/tpm && ~/.config/tmux/plugins/tpm/bin/install_plugins'"

run '~/.config/tmux/plugins/tpm/tpm'

# Install any declared @plugin whose dir (the part after the last "/") is missing on an already-bootstrapped
# machine; no per-plugin list to maintain.
if-shell 'for p in $(grep -E "^[^#]*@plugin" ~/.tmux.conf | grep -oE "[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+"); do [ -d "$HOME/.config/tmux/plugins/${p##*/}" ] || exit 0; done; exit 1' \
  "run '~/.config/tmux/plugins/tpm/bin/install_plugins'"

# Hide the horizontal window list (switching is the `prefix w` picker). MUST be the last thing in this file:
# catppuccin sets these formats, and so does `run '.../tpm/tpm'` above when it re-sources catppuccin.tmux, so
# anything earlier is overwritten. tmux-agent-notify.sh's 🔴/🟢 live in the window NAME, so they still show in
# the picker and fire notifications, just not on the bar.
set -g window-status-format ""
set -g window-status-current-format ""
set -g window-status-separator ""
